			function nat_table()
			{
				var dynamicHTML = '';
				for(var i=0; i<10; i++ )
				{
					if (typeof window['nat_ip' + i] == 'undefined') {
						break;
					}
					dynamicHTML += "<tr height=30>";
					dynamicHTML += "<td align='center' class='topborderstyle'>"+ i.toString() + "</td>";
					dynamicHTML += "<td align='center' class='topborderstyle'>"+ window['nat_ip' + i] + "</td>";
					dynamicHTML += "<td align='center' class='topborderstyle'>"+ window['session_count' + i] + "</td>";
					dynamicHTML += "</tr>";
				}
			document.write(dynamicHTML);
