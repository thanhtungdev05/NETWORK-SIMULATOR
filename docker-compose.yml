services:
  ftc-virtual:
    build: .
    image: ftc-virtual:latest
    container_name: ftc-virtual
    env_file:
      - .env
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8090:8090"
      - "8092:8092"
      - "8094:8094"
      - "8096:8096"
      - "8098:8098"
    restart: unless-stopped
