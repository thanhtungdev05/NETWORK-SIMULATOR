<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/sim-pages/sim.css"></head><body>
<div class="card"><div class="hd">DMZ</div><div class="bd">
  <div class="row"><div class="lbl">DMZ</div><div class="ctrl"><label class="sw"><input type="checkbox" id="en" onchange="tog()"><span class="slider"></span></label></div></div>
  <div class="row" id="ipRow" style="display:none"><div class="lbl">Device/IP</div><div class="ctrl">
    <input type="text" list="macs" placeholder="Please select or type IP">
    <datalist id="macs"><option value="192.168.100.10"></option><option value="192.168.100.24"></option><option value="192.168.100.31"></option></datalist>
  </div></div>
</div></div>
<div class="actions"><button class="btn apply" onclick="simState.save()">Apply</button><button class="btn undo" onclick="location.reload()">Undo</button></div>
<script>function tog(){document.getElementById('ipRow').style.display=document.getElementById('en').checked?'':'none';}</script>
<script src="/sim-pages/state.js"></script>
</body></html>
