<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/sim-pages/sim.css"></head><body>
<div class="card"><div class="hd">Rtty configure</div><div class="bd"><div class="row"><div class="lbl">Interface</div><div class="ctrl"><select ><option selected>lan</option><option >wan</option></select></div></div><div class="row"><div class="lbl">Device ID</div><div class="ctrl"><input type="text" value="My-Device"></div></div><div class="row"><div class="lbl">Description</div><div class="ctrl"><input type="text" value="Description of my device"></div></div><div class="row"><div class="lbl"><span class="req">*</span>Server host</div><div class="ctrl"><input type="text" value="your-server-host"></div></div><div class="row"><div class="lbl"><span class="req">*</span>Server port</div><div class="ctrl"><input type="text" value="5912"></div></div><div class="row"><div class="lbl">SSL</div><div class="ctrl"><label class="sw"><input type="checkbox" checked><span class="slider"></span></label></div></div><div class="row"><div class="lbl">Keepalive Time</div><div class="ctrl"><input type="text" value="5" style="max-width:200px;display:inline-block"> <span class="u">seconds</span></div></div><div class="row"><div class="lbl">Token</div><div class="ctrl"><input type="text" value="your-token"></div></div></div></div>
<div class="actions"><button class="btn apply" onclick="simState.save()">Apply</button><button class="btn undo" onclick="location.reload()">Undo</button></div>
<script src="/sim-pages/state.js"></script>
</body></html>
