<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AX3000S - Đăng nhập</title>
  <link href="/luci-static/skgwfpt/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; }
    .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; }
    .box { width: 420px; max-width: 92vw; background: #fff; border-radius: 12px;
           box-shadow: 0 8px 30px rgba(0,0,0,.08); padding: 34px 36px; }
    .brand { text-align: center; margin-bottom: 8px; color: #f5811f; font-size: 26px; font-weight: 700; }
    .model { text-align: center; color: #666; margin-bottom: 26px; font-size: 14px; }
    label { display: block; font-size: 13px; color: #444; margin: 14px 0 6px; }
    input[type=text], input[type=password] { width: 100%; height: 44px; box-sizing: border-box;
      border: 1px solid #d5d9e0; border-radius: 8px; padding: 0 12px; font-size: 15px; }
    .btn-login { width: 100%; height: 46px; margin-top: 22px; border: 0; border-radius: 8px;
      background: #f5811f; color: #fff; font-size: 16px; cursor: pointer; }
    .btn-login:hover { background: #e5720f; }
    .hint { margin-top: 16px; font-size: 12px; color: #8a8f98; text-align: center; line-height: 1.6; }
    .sim-tag { position: fixed; top: 10px; right: 12px; background: #eef; color: #335; font-size: 11px;
      padding: 4px 10px; border-radius: 20px; }
  </style>
</head>
<body>
  <div class="sim-tag">BẢN GIẢ LẬP • dùng cho đào tạo</div>
  <div class="wrap">
    <form class="box" onsubmit="return doLogin(event)">
      <div class="brand">FPT Mesh Router</div>
      <div class="model">AX3000S — Trang cấu hình</div>

      <label>Tên đăng nhập</label>
      <input type="text" id="user" value="admin" autocomplete="username" />

      <label>Mật khẩu</label>
      <input type="password" id="pass" value="admin" autocomplete="current-password" />

      <button class="btn-login" type="submit">Đăng nhập</button>
      <div class="hint">
        Tài khoản mặc định của bản giả lập: <b>admin / admin</b><br>
        (Bản giả lập chấp nhận mọi mật khẩu để tiện thực hành.)
      </div>
    </form>
  </div>

  <script>
    let TRACKING_TECHNICIAN_ID = "DEV_TECH_001";
    let TRACKING_LAB_ID = "LAB_VIRTUAL_ONT_AX3000S";
    let TRACKING_MODE = "Thực hành";

    let TRACKING_TIMER_URL = "http://localhost:8082/api/index.php/tracking/timer";
    let TRACKING_TIMER_NAME = "KTV DEV_TECH_001";
    let TRACKING_TIMER_EMAIL = "devtech001@fpt.com";
    let TRACKING_TIMER_FINISHED_AT = "2026-08-05T10:30:00+07:00";
    let TRACKING_TIMER_DURATION_SEC = 42;
    let TRACKING_TIMER_DEVICE = "AX3000S";

    window.TRACKING_TECHNICIAN_ID = TRACKING_TECHNICIAN_ID;
    window.TRACKING_LAB_ID = TRACKING_LAB_ID;
    window.TRACKING_MODE = TRACKING_MODE;
    window.TRACKING_TIMER_URL = TRACKING_TIMER_URL;
    window.TRACKING_TIMER_NAME = TRACKING_TIMER_NAME;
    window.TRACKING_TIMER_EMAIL = TRACKING_TIMER_EMAIL;
    window.TRACKING_TIMER_FINISHED_AT = TRACKING_TIMER_FINISHED_AT;
    window.TRACKING_TIMER_DURATION_SEC = TRACKING_TIMER_DURATION_SEC;
    window.TRACKING_TIMER_DEVICE = TRACKING_TIMER_DEVICE;

    function sendTrackingTimer() {
      const body = {
        technician_id: TRACKING_TECHNICIAN_ID,
        name: TRACKING_TIMER_NAME,
        email: TRACKING_TIMER_EMAIL,
        lab_id: TRACKING_LAB_ID,
        mode: TRACKING_MODE,
        device: TRACKING_TIMER_DEVICE,
        finished_at: TRACKING_TIMER_FINISHED_AT,
        duration_sec: TRACKING_TIMER_DURATION_SEC,
      };

      console.log("TRACKING TIMER payload:", body);

      return fetch(TRACKING_TIMER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(body),
        keepalive: true,
      })
        .then(function (res) { return res.json(); })
        .then(function (data) { console.log("TRACKING TIMER response:", data); })
        .catch(function (err) { console.error("TRACKING TIMER error:", err); });
    }

    function doLogin(e) {
      e.preventDefault();
      sendTrackingTimer().finally(function () {
        // Bản giả lập: không kiểm tra mật khẩu thật, chuyển thẳng vào trang quản trị.
        window.location.href = "app.html";
      });
      return false;
    }
  </script>
</body>
</html>
