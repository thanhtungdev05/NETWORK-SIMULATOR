<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/sim-pages/sim.css"></head>
<body>

<div class="card"><div class="bd">
  <div class="row">
    <div class="lbl">Country Code</div>
    <div class="ctrl"><select><option>US</option><option selected>VN</option><option>SG</option></select></div>
  </div>
</div></div>

<div class="card">
  <div class="hd">2G</div>
  <div class="bd">
    <div class="row"><div class="lbl">Radio Enabled</div><div class="ctrl"><label class="sw"><input type="checkbox" checked><span class="slider"></span></label></div></div>
    <div class="row"><div class="lbl">802.11 Mode</div><div class="ctrl"><select><option>11BGNAX</option><option>11BGN</option><option>11N only</option></select></div></div>
    <div class="row"><div class="lbl">Band Width</div><div class="ctrl"><select><option>20 MHz</option><option>40 MHz</option></select></div></div>
    <div class="row"><div class="lbl">Channel</div><div class="ctrl"><select><option>auto</option><option>1</option><option>6</option><option>11</option></select></div></div>
    <div class="row"><div class="lbl">Beacon Interval</div><div class="ctrl"><input type="text" value="100"></div></div>
    <div class="row"><div class="lbl">RTS Threshold</div><div class="ctrl"><input type="text" value="2347"></div></div>
    <div class="row"><div class="lbl">DTIM Interval</div><div class="ctrl"><input type="text" value="1"></div></div>
  </div>
</div>

<div class="card">
  <div class="hd">5G</div>
  <div class="bd">
    <div class="row"><div class="lbl">Radio Enabled</div><div class="ctrl"><label class="sw"><input type="checkbox" checked><span class="slider"></span></label></div></div>
    <div class="row"><div class="lbl">802.11 Mode</div><div class="ctrl"><select><option>11ANACAX</option><option>11ANAC</option><option>11AX only</option></select></div></div>
    <div class="row"><div class="lbl">Band Width</div><div class="ctrl"><select><option>20 MHz</option><option>40 MHz</option><option>80 MHz</option><option selected>160 MHz</option></select></div></div>
    <div class="row"><div class="lbl">Channel</div><div class="ctrl"><select><option>auto</option><option>36</option><option>40</option><option>44</option><option>48</option><option>149</option><option>153</option><option>157</option><option>161</option></select></div></div>
    <div class="row"><div class="lbl">Beacon Interval</div><div class="ctrl"><input type="text" value="100"></div></div>
    <div class="row"><div class="lbl">RTS Threshold</div><div class="ctrl"><input type="text" value="2347"></div></div>
    <div class="row"><div class="lbl">DTIM Interval</div><div class="ctrl"><input type="text" value="1"></div></div>
  </div>
</div>

<div class="actions">
  <button class="btn apply" onclick="simState.save()">Apply</button>
  <button class="btn undo" onclick="location.reload()">Undo</button>
</div>
<script src="/sim-pages/state.js"></script>
</body></html>
