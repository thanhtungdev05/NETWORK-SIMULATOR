<!DOCTYPE html><html ng-app=myApp ng-controller=TranslateCtrl><head><script src="/js/gettext.min.js?094907"></script><meta / charset=UTF-8><title>Certificate Backup/Restoration</title><link href="/style.min.css?094907" rel=stylesheet type=text/css></head><body class=ng-cloak><table align=center border=0 cellpadding=0 cellspacing=0 width=700><tr><td valign=top><b parent="{{ 'Certificate Management' | translate }}" sub-title translate>Certificate Backup</b><hr><table align=center border=0 cellpadding=2 cellspacing=0 width=100%><tr><td align=left><b translate>Certificate Backup / Restoration</b></td></tr></table><table align=center border=1 cellPadding=0 cellSpacing=0 width=750><tr><td valign=top><table align=center border=0 cellpadding=0 cellspacing=0 width=100%><tr><td><b translate>Backup</b></td></tr></table><form name=frm1 target=gCertSender><table align=center border=0 cellPadding=2 cellSpacing=0 width=680><tr><td>&nbsp;&nbsp;<translate>Encrypt password</translate>:&nbsp;<input maxlength=64 name=epwd placeholder="{{ 'Max: ###LEN### characters' | translate }}" size=22 type=password></td></tr><tr><td>&nbsp;&nbsp;<translate>Confirm password</translate>:&nbsp;<input maxlength=64 name=repwd size=22 type=password></td></tr><tr><td>&nbsp;&nbsp;<span id="clkbakuptdlcerti" translate>Click <input> to download certificates to your local PC as a file.</span></td></tr><input name=sFormAuthStr type=hidden value="JdvKVyYlhh7GhS9"></table></form><hr size=1><table align=center border=0 cellpadding=2 cellspacing=0 width=100%><tr><td><b translate>Restoration</b></td></tr></table><form action="/gCertRst.cgi?sFormAuthStr=JdvKVyYlhh7GhS9" enctype=multipart/form-data method=POST name=frm2 target=gCertSender><table align=center border=0 cellPadding=2 cellSpacing=0 width=680><tr><td>&nbsp;&nbsp;<translate>Select a backup file to restore.</translate></td></tr><tr><td>&nbsp;&nbsp;&nbsp;&nbsp;<input class=file name=data size=40 type=file></td></tr><tr><td>&nbsp;&nbsp;<translate>Decrypt password</translate>:&nbsp;<input maxlength=64 name=dpwd size=22 type=password></td></tr><tr><td>&nbsp;&nbsp;<span id="clkrestoreuplf" translate>Click <input> to upload the file.</span></td></tr><input name=sFormAuthStr type=hidden value="JdvKVyYlhh7GhS9"></table></form></td></tr></table></td></tr></table><script> top.ACTION_STATUS=-1;top.iActionStatusFlag='0';top.iFwUpgradeState='0';top.act_sta.damage_alert();var BakOrRst;angular.element(document).ready(function(){angular.element(document.querySelector("#clkbakuptdlcerti input")).attr({class:"button",type:"button",value:gettext("Backup"),onclick:"waitResponse(1)"});angular.element(document.querySelector("#clkrestoreuplf input")).attr({class:"button",type:"submit",name:"attach",value:gettext("Restore"),onclick:"return waitResponse(0)"});angular.forEach(document.querySelectorAll("input[placeholder]"),function(self){self.placeholder=self.placeholder.replace("###LEN###",self.maxLength);});});function waitResponse(backupOrRestore){BakOrRst=backupOrRestore;if(0==backupOrRestore){if(document.frm2.data.value!=""){document.frm2.submit();setTimeout("parent.gCertHandler.document.location='/doc/XgCerHlr.HTM'",3000);}else{return false;}return true;}else if(1==backupOrRestore){if(document.frm1.epwd.value!=""||document.frm1.repwd.value!=""){if(document.frm1.epwd.value!=document.frm1.repwd.value){alert(gettext("Password and confirmed password are different!"));return false;}} document.location="/certificate.cfg?sFormAuthStr=JdvKVyYlhh7GhS9&epwd="+document.frm1.epwd.value;return true;}else{return false;}}</script></body></html>
