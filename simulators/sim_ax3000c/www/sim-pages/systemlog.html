<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/sim-pages/sim.css"></head><body>
<div class="card"><div class="hd">System Log</div><div class="bd"><div class="row"><div class="lbl">Log Level</div><div class="ctrl"><select ><option >Please select</option><option >Emergency</option><option >Alert</option><option >Critical</option><option >Error</option><option >Warning</option><option >Notice</option><option selected>Info</option><option >Debug</option></select></div></div><div class="row"><div class="lbl">External system log server state</div><div class="ctrl"><select ><option selected>Disable</option><option >Enable</option></select></div></div><div class="row"><div class="lbl">External system log server</div><div class="ctrl"><input type="text" value=""></div></div><div class="row"><div class="lbl">External system log server port</div><div class="ctrl"><input type="text" value="514"></div></div><div class="row"><div class="lbl">External system log server protocol</div><div class="ctrl"><select ><option selected>UDP</option><option >TCP</option></select></div></div></div></div>
<div class="actions"><button class="btn apply" onclick="simState.save()">Apply</button><button class="btn undo" onclick="location.reload()">Undo</button></div>
<div class="card"><div class="hd">System Log Information</div><div class="bd"><table class="tbl"><thead><tr><th>Date</th><th>Time</th><th>Level</th><th>Info</th></tr></thead><tbody><tr><td colspan="4" class="empty">No data</td></tr></tbody></table></div></div>
<script src="/sim-pages/state.js"></script>
</body></html>
