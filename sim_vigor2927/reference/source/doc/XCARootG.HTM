ltIP.value!=""){if(!bg.isStrIp(f.AltIP.value)){alert(gettext("Please enter a valid IP address."));f.AltIP.focus();f.AltIP.select();return false;}} if(f.AltType.value==2){if(f.AltEmail.value.indexOf("@")<0){alert(gettext("Email format error"));f.AltEmail.focus();f.AltEmail.select();return false;}}} var re=/^[A-Za-z]{2}$/;if(f.DNC.value==""){alert(gettext("Please input Country!"));f.DNC.focus();f.DNC.select();return false;}else if(!f.DNC.value.match(re)){alert(gettext("You MUST input 2 alphabets in 'Country' field!"));f.DNC.focus();f.DNC.select();return false;}if(f.DNCN.value==""){alert(gettext("Please input Common Name!"));f.DNCN.focus();f.DNCN.select();return false;}if(checkWebChange()){f.webchange.value='1';}var altstr1=gettext("The process may take up to 30 seconds.");if('(nil)'=='1'){altstr1+="\n";altstr1+=gettext("Attention! If SSL/TLS Inspection is enabled, you must export and install the RootCA to the LAN client device again after regenerating.");}alert(altstr1);f.fid.value=1215;f.submit();return true;}function clkFillDef(){bg.setVle2Elmt(f.AltType,0,0);f.AltIP.value="";f.DNC.value="TW";f.DNST.value="HsinChu";f.DNL.value="HuKou";f.DNO.value="DrayTek Corp.";f.DNOU.value="DrayTek Support";f.DNCN.value="Vigor Router";f.DNE.value="";bg.setVle2Elmt(f.KeyType,0,0);bg.setVle2Elmt(f.KeySize,1,0);bg.setVle2Elmt(f.isSha1,0,0);}function chgAltType(){r_ip.style.display="none";r_dn.style.display="none";r_email.style.display="none";if(s.selectedIndex==0){r_ip.style.display="";}else if(s.selectedIndex==1){r_dn.style.display="";}else if(s.selectedIndex==2){r_email.style.display="";}}</script></body></html>
