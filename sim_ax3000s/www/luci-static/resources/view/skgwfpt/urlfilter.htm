<div class="page-content">
    <p class="sk-warning-info">
        {{UrlFilter_Note}}<br>
    </p>
    <p class="skpage-title">{{UrlFilter_Title}}</p>
    <div class="modset">
        <div class="skform-group">
            <label class="skform-tittle" for="">{{Enable:}}</label>
            <div class="skform-content">
                <ul>
                    <li>
                        <label class="skradio">
                            <input type="radio" name="urlEnbl" id="urlftEn1" onClick='RadioClick_urlFilterEn()' hidden/>
                            <label for="urlftEn1" id="urlFilter_disable" class="skradio-label">
                            </label>
                        </label>
                        <label class="skradio-text" for="urlftEn1">{{Disable}}</label>
                    </li>
                    <li>
                        <label class="skradio">
                            <input type="radio" name="urlEnbl" id="urlftEn2" onClick='RadioClick_urlFilterEn()' hidden/>
                            <label for="urlftEn2" id="urlFilter_enable" class="skradio-label">
                            </label>
                        </label>
                        <label class="skradio-text" for="urlftEn2">{{Enable}}</label>
                    </li>
                </ul>
            </div>
        </div>

        <div class="skform-group">
            <label class="skform-tittle" for="">{{Filter_Mode}}</label>
            <div class="skform-content">
                <ul>
                    <li>
                        <label class="skradio">
                            <input type="radio" name="listtype" id="urlftMode1" onClick='RadioClick_urlFilterMode(0)' hidden/>
                            <label for="urlftMode1" id="urlFilterMode_deny" class="skradio-label">
                            </label>
                        </label>
                        <label class="skradio-text" for="urlftMode1">{{Deny_List}}</label>
                    </li>
                    <li>
                        <label class="skradio">
                            <input type="radio" name="listtype" id="urlftMode2" onClick='RadioClick_urlFilterMode(1)' hidden/>
                            <label for="urlftMode2" id="urlFilterMode_allow" class="skradio-label">
                            </label>
                        </label>
                        <label class="skradio-text" for="urlftMode2">{{Allow_List}}</label>
                    </li>
                </ul>
            </div>
        </div>

        <div class="sk-form-submit">
            <button class="btn-apply" id="UrlfSave_btn" type="button" onclick="Urlf_BntClick_Apply()">{{Save_And_Apply}}</button>
        </div>
    </div>
    <p class="skpage-title">{{URL_Filter_Table}}</p>
    <div class="modset">
        <div class="table-list">
            <div class="table-list-head">
                <button class="btn btn-add" type="button" id="Btn_Add" onclick="BtnClick_UrlFilterAdd()">{{Add}}</button>
                <button class="btn btn-del" type="button" id="Btn_Remove" onclick="BtnClick_UrlFilterRemoveApply(this.rml)">{{Delete}}</button>
            </div>
            <table id="Tbl_Scheduler_Url" style="margin-bottom: 20px;" >
                <thead>
                    <tr>
                        <th>
                            <label class="skcheckbox">
                                <input type="checkbox" name="urlf_seletall" id="urlf_seletall" onClick='url_selectAll(this)' hidden/>
                                <label for="urlf_seletall" class="skcheckbox-label">
                                </label>
                            </label>
                        </th>
                        <th>{{URL_Address}}</th>
                        <!-- <th>{{Schedule}}</th> -->
                        <th>{{Repeat Period}}</th>
                        <th>{{Start Time}}</th>
                        <th>{{End Time}}</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <p class="skpage-title">{{Keyword_Filter_Table}}</p>
    <div class="modset">
        <div class="table-list">
            <div class="table-list-head">
                <button class="btn btn-add" type="button" id="Btn_AddKey" onclick="BtnClick_KeyFilterAdd()">{{Add}}</button>
                <button class="btn btn-del" type="button" id="Btn_RemoveKey" onclick="BtnClick_KeyFilterRemoveApply(this.rmlkey)">{{Delete}}</button>
            </div>
            <table id="Tbl_Scheduler_Key" style="margin-bottom: 20px;" >
                <thead>
                    <tr>
                        <th>
                            <label class="skcheckbox">
                                <input type="checkbox" name="urlf_seletallkey" id="urlf_seletallkey" onClick='url_selectAllKey(this)' hidden/>
                                <label for="urlf_seletallkey" class="skcheckbox-label">
                                </label>
                            </label>
                        </th>
                        <th>{{Keyword}}</th>
                        <!-- <th>{{Schedule}}</th> -->
                        <th>{{Repeat Period}}</th>
                        <th>{{Start Time}}</th>
                        <th>{{End Time}}</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>
