<div class="page-content">
	<p class="sk-warning-info">{{This page allows you to enable or disable IPTV snooping}}</p>  
    <p class="skpage-title">{{IPTV Snooping Settings}}</p>
	
	<div class="modset">
		<div class="skform-group">
			<label class="skform-tittle">{{IPTV Snooping Enable}}</label>
			<label class="skcheckbox skcheckbox-form">
				<input type="checkbox" name="chkSnooping" id="igmpsnooping_chkSnooping"  hidden/>
				<label for="igmpsnooping_chkSnooping" id="iptvSnoopEnable_btn" class="skcheckbox-label">
				</label>
			</label>
		</div>
		
		<div class="sk-form-submit">
		<input class="btn-apply" id="iptvSnoopSave_btn" type='button' onClick='igmpsnooping_btnSave()' value='{{Save & Apply}}'> 
		</div>
	</div>
</div>
