<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/sim-pages/sim.css"></head><body>
<div class="card"><div class="hd">Wi-Fi Timer</div><div class="bd"><div class="row"><div class="lbl">Enable time switch Wi-Fi</div><div class="ctrl"><select ><option selected>Disable</option><option >Enable</option></select></div></div><div class="row"><div class="lbl">Start time</div><div class="ctrl"><input type="text" value="00:00" style="max-width:160px;display:inline-block"></div></div><div class="row"><div class="lbl">End time</div><div class="ctrl"><input type="text" value="00:00" style="max-width:160px;display:inline-block"></div></div><div class="row"><div class="lbl">Weekdays</div><div class="ctrl"><div style="display:flex;flex-wrap:wrap"><label style="margin-right:16px"><input type="checkbox"> Mon</label><label style="margin-right:16px"><input type="checkbox"> Tue</label><label style="margin-right:16px"><input type="checkbox"> Wed</label><label style="margin-right:16px"><input type="checkbox"> Thu</label><label style="margin-right:16px"><input type="checkbox"> Fri</label><label style="margin-right:16px"><input type="checkbox"> Sat</label><label style="margin-right:16px"><input type="checkbox"> Sun</label></div></div></div></div></div>
