<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

				vertical-align: top;
			}

			body {
				color: #51545e;
				user-select: none;
			}

			p {
				color: #51545e;

			.cpe-wrapper {
				width: 100%;
				height: 100vh;
				margin: 0;
				padding: 0;
				background-color: #f2f4f6;
			}

			.cpe-content {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
			}
			/* Body ------------------------------ */

			.cpe-body {
				position: relative;
				width: 100%;
				min-height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
				margin: 0;
				padding: 0;
			}

			.background_body {
				background-image: url('/portal/assets/images/[04_05_2024]_background_body.jpg');
				background-repeat: no-repeat;
				background-size: cover;
				background-position: center;
				height: 100%;
				width: 100%;
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				filter: blur(3px) brightness(0.3);
				z-index: 99999;
			}

			.cpe-body_inner {
				position: relative;
				width: 850px;
				min-height: 651px;
				margin: 70px auto;
				border-radius: 15px;
				padding: 0 0 0 330px;
				overflow: hidden;
				background-image: url('/portal/assets/images/[03_07_2025]_slider_pc.png');
				background-repeat: no-repeat;
				background-size: 100% 100%;
				background-position: center;
				z-index: 9999999;
				transition: background-image 0.5s ease-in-out;
			}

			.bg_slider_mobile {
				position: relative;
				width: 100%;
				min-height: 160px;
				border-radius: 15px;
				border-bottom-left-radius: 0;
				border-bottom-right-radius: 0;
				overflow: hidden;
				background-image: url('/portal/assets/images/[03_07_2025]_slider_mobile.png');
				background-repeat: no-repeat;
				background-size: 100% 100%;
				background-position: center;
				transition: background-image 0.5s ease-in-out;
			}

			.content-cell {
				position: relative;
				padding: 40px 15px 20px 20px;
				background-color: #fff;
				border-radius: 15px;
				z-index: 99999;
			}

			.content_container {
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				position: absolute;
				top: 0;
				right: 0;
				left: 0;
				bottom: 0;
				padding: 10px;
			}

			.sub_header {
				font-weight: 400;
				font-size: 13px;
				color: #565e78;
				line-height: 23px;
				text-align: left;
			}

			/* PC */
			@media only screen and (min-width: 1025px) {
				#mobile {
					display: none;
				}
			}

			/* IPAD */
			@media only screen and (min-width: 768px) and (max-width: 1024px) {
				#mobile {
					display: none;
				}
				.cpe-body_inner {
					width: 95% !important;
					padding-left: 355px !important;
				}
			}

			@media only screen and (max-width: 600px) {
				.cpe-body_inner {
					background-image: url('/portal/assets/images/[03_07_2025]_slider_mobile.png') !important;
					padding: 0;
				}

				.sub_header {

				}

				.content-cell {
					border-top-left-radius: 0;
					border-top-right-radius: 0;
					padding: 10px;
					height: 79%;
				}

				.cpe-body_inner {
					width: 95% !important;
				}

											</div>
										</td>

			const emailBoyInnerElement = document.querySelector('.cpe-body_inner');

			//! LẤY THÔNG TIN TỪ PARAMS URL: ...?mac=AABBCCDDEEFF&model=AP-AX3000CV2 ==> ƯU TIÊN HƠN
			const urlParams = new URLSearchParams(window.location.search);
			const mac = `${urlParams.get('mac') || ''}`;
			const model = `${urlParams.get('model') || ''}`;
			//!

			/*
				LẤY THÔNG TIN TỪ FILE TXT LOCAL, ĐỊNH DẠNG FILE NHƯ SAU
				model:AP-AX3000CV2
				mac:AABBCCDDEEFF
			*/
			const loadInfoFromFileTxt = async () => {
				try {
					const response = await fetch('/portal/assets/device_info.txt');
					if (response.ok) {
						const text = await response.text();
						const lines = text.split('\n');
						let modelValue = '';
						let macValue = '';
						lines.forEach((line) => {
							const [key, value] = line.split(':');
							if (key && value) {
								if (key.trim().toLowerCase() === 'model')
									modelValue = value.trim();
								if (key.trim().toLowerCase() === 'mac') macValue = value.trim();
							}
						});
						if (!model && modelValue) modelElement.innerHTML = modelValue;
						if (!mac && macValue)
							macElement.innerHTML = `với mac <b style="color: #000; white-space: nowrap">${macValue}</b>`;
					}
				} catch (e) {
					// ignore error
				}
			};
			if (!mac || !model) {
				loadInfoFromFileTxt();
			} else {
				modelElement.innerHTML = model ? `${model}` : '';
				macElement.innerHTML = mac

					: '';

			];

					'important',
				);
				emailBoyInnerElement.style.setProperty(
					'background-image',

			// CONTACT FPT
			contactFPT.addEventListener('click', async (e) => {
				if (/android/i.test(userAgent)) {
					var isCaptiveportal = /Version/i.test(userAgent);
					if (isCaptiveportal) {
						window.location.replace(
