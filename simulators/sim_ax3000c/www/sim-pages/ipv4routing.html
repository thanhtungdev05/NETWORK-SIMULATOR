<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/sim-pages/sim.css"></head><body>
<div class="card"><div class="hd">IPv4 Static Routing</div><div class="bd">
  <div class="row"><div class="lbl">Destination Network</div><div class="ctrl"><input type="text" id="net" placeholder="e.g. 10.0.0.0"></div></div>
  <div class="row"><div class="lbl">Prefix</div><div class="ctrl"><input type="text" id="pfx" placeholder="e.g. 24"></div></div>
  <div class="row"><div class="lbl">Gateway IP</div><div class="ctrl"><input type="text" id="gw" placeholder="e.g. 192.168.100.1"></div></div>
  <div style="text-align:right"><button class="btn apply btn-sm" onclick="addRoute()">Add</button></div>
</div></div>
<div class="card"><div class="hd">Routing Table</div><div class="bd">
  <table class="tbl"><thead><tr><th>Network</th><th>Prefix</th><th>Gateway</th><th style="width:100px">Edit</th></tr></thead>
  <tbody id="tb"><tr id="empty"><td colspan="4" class="empty">No data</td></tr></tbody></table>
</div></div>
<div class="actions"><button class="btn apply" onclick="simState.save()">Apply</button><button class="btn undo" onclick="location.reload()">Undo</button></div>
<script src="/sim-pages/table.js"></script>
<script>
simTable([function(v){return v||'';},function(v){return v||'';},function(v){return v||'';}],4);
function addRoute(){
  var n=document.getElementById('net').value.trim(),p=document.getElementById('pfx').value.trim(),g=document.getElementById('gw').value.trim();
  if(!/^(\d{1,3}\.){3}\d{1,3}$/.test(n)){alert('Destination Network khong hop le');return;}
  if(!/^\d{1,2}$/.test(p)||+p>32){alert('Prefix phai 0-32');return;}
  if(!/^(\d{1,3}\.){3}\d{1,3}$/.test(g)){alert('Gateway IP khong hop le');return;}
  simAdd([n,p,g]);
  document.getElementById('net').value='';document.getElementById('pfx').value='';document.getElementById('gw').value='';
}
</script>
<script src="/sim-pages/state.js"></script>
</body></html>
