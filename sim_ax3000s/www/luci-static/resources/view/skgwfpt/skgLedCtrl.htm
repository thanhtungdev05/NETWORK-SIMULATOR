<div class="page-content">
	<p class="sk-warning-info">
		{{ledCtrlWarningText}}<br/>
	</p>
	<div class="modset">
	    <div class="skform-group">
			<label class="skform-tittle" for="at-led-control">{{ledCtrlTitleText}}</label>
			<label class="skcheckbox skcheckbox-form">
                <input type="checkbox" name="at-led-control" id="at-led-control" hidden />
                <label for="at-led-control" id="ledEnable" class="skcheckbox-label">
                </label>
            </label>
		</div>
		<div class="sk-form-submit">
			<button class="btn-apply" type="button" name="at-sntp-btn-apply" id="at-sntp-btn-apply"
				onclick="buttonApplyClick()">{{ledCtrlBtnText}}</button>
		</div>
	</div>
</div>
