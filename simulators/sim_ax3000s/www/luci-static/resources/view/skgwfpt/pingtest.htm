<div class="page-content">
	<p class="sk-warning-info">
		{{This page is used to diagnose the current network connection.}}<br/>
	</p>
    <p class="skpage-title">{{PING Test}}</p>
	<div class="modset">
		<div class="skform-group">
			<label class="skform-tittle" for="diag_ping_url">{{IP/Domain Address:}}</label>
			<input type="text" class="skform-control" id="diag_ping_url" name="diag_ping_url"/>
		</div>
	
		<div class="skform-group">
			<label class="skform-tittle" for="diag_ping_protocol">{{Protocol:}}</label>
            <select size="1" class="skform-control" id="diag_ping_protocol" name="diag_ping_protocol" onChange="diag_ping_protocol_change(this)">
                <option value="-4">IPv4</option>
                <option value="-6">IPv6</option>
            </select>
		</div>
	
		<div class="skform-group">
			<label class="skform-tittle" for="diag_ping_interface">{{Interface:}}</label>
            <select size="1" class="skform-control" id="diag_ping_interface" name="diag_ping_interface" onChange="diag_ping_interface_change(this)">
            </select>
		</div>
	
		<div class="skform-group">
                        <textarea id="diag_ping_result" style="height: 150px; width:580px;" readonly></textarea>
                </div>


        <div class="sk-form-submit">
            <button class="btn-apply" type="button" name="button_start" id="button_start" onclick="btn_Start()">{{Start}}</button>
        </div>

	
	</div>
</div>
