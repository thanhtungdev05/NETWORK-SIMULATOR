<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/sim-pages/sim.css"></head>
<body>

<div class="card">
  <div class="hd">EasyMesh</div>
  <div class="bd">
    <div class="row"><div class="lbl">EasyMesh Enabled</div><div class="ctrl"><label class="sw"><input type="checkbox" checked><span class="slider"></span></label></div></div>
    <div class="row"><div class="lbl">Role</div><div class="ctrl"><select><option>Controller</option><option>Agent</option></select></div></div>
    <div class="row"><div class="lbl">Backhaul preference</div><div class="ctrl"><select><option>Auto</option><option>Ethernet</option><option>Wireless</option></select></div></div>
    <div class="row"><div class="lbl">Mesh SSID</div><div class="ctrl"><input type="text" value="FPT-Mesh"></div></div>
  </div>
</div>

<div class="actions">
  <button class="btn apply" onclick="simState.save()">Apply</button>
  <button class="btn undo" onclick="location.reload()">Cancel</button>
</div>
<script src="/sim-pages/state.js"></script>
</body></html>
