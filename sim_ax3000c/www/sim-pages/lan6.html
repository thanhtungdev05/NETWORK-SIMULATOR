<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/sim-pages/sim.css"></head><body>
<div class="card"><div class="hd">LAN IPv6</div><div class="bd"><div class="row"><div class="lbl">PD Mode</div><div class="ctrl"><select ><option selected>auto</option><option >Manual</option></select></div></div><div class="row"><div class="lbl">Prefix</div><div class="ctrl"><input type="text" value="auto"></div></div><div class="row"><div class="lbl">Preferred Lifetime</div><div class="ctrl"><input type="text" value="0" style="max-width:120px;display:inline-block"> D  <input type="text" value="0" style="max-width:120px;display:inline-block"> H  <input type="text" value="0" style="max-width:120px;display:inline-block"> M</div></div><div class="row"><div class="lbl">Enable RADVD</div><div class="ctrl"><label class="sw"><input type="checkbox" checked><span class="slider"></span></label></div></div><div class="row"><div class="lbl">M Flag</div><div class="ctrl"><label class="sw"><input type="checkbox" ><span class="slider"></span></label></div></div><div class="row"><div class="lbl">O Flag</div><div class="ctrl"><label class="sw"><input type="checkbox" ><span class="slider"></span></label></div></div><div class="row"><div class="lbl">Enable DHCPv6 Server</div><div class="ctrl"><label class="sw"><input type="checkbox" checked><span class="slider"></span></label></div></div><div class="row"><div class="lbl">IPv6 Start Suffix</div><div class="ctrl"><input type="text" value="2"></div></div><div class="row"><div class="lbl">IPv6 End Suffix</div><div class="ctrl"><input type="text" value="254"></div></div><div class="row"><div class="lbl">Enable ULA</div><div class="ctrl"><label class="sw"><input type="checkbox" ><span class="slider"></span></label></div></div><div class="row"><div class="lbl">ULA Prefix</div><div class="ctrl"><input type="text" value="fd00::/48"></div></div></div></div>
<div class="actions"><button class="btn apply" onclick="simState.save()">Apply</button><button class="btn undo" onclick="location.reload()">Undo</button></div>
<script src="/sim-pages/state.js"></script>
</body></html>
